name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,live]"
      - name: Tests
        run: python -m pytest -q tests
      - name: Version consistency
        run: python scripts/version_sync.py --check
      - name: Progress table
        run: python scripts/progress.py --check
      - name: Changelog
        run: python scripts/changelog_md.py --check
      - name: Whitespace
        run: git diff --check HEAD^

  release-artifact:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable archive
        run: |
          test -f "archive/versions/${GITHUB_REF_NAME}/manifest.json"
          test -f "archive/versions/${GITHUB_REF_NAME}/NOTES.md"
          test -f "archive/versions/${GITHUB_REF_NAME}/changelog.jsonl"
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            archive/versions/${{ github.ref_name }}/
            VERSION
            CHANGELOG.md
